<style>
  /* Styles propres à l'écran Organisation */
  .layout {
    width: 100%;
    max-width: var(--content-max-w);
    margin: 0 auto;
    padding: 24px 36px 64px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (max-width: 600px) {
    .topbar, .breadcrumb-bar, .page-head, .layout { padding-left: 18px; padding-right: 18px; }
  }

  /* Actions Consultation / Modification */
  .org-actions {
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    width: 100%;
    max-width: var(--content-max-w);
    margin: 14px auto 0;
    padding: 0 36px;
  }
  @media (max-width: 600px) {
    .org-actions { padding-left: 18px; padding-right: 18px; }
  }
  .org-actions .filter-btn {
    border-radius: 10px;
    padding: 0 22px;
    font-weight: 700;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .org-actions .filter-btn.is-active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }

  /* Carte table modernisée */
  #toolbar-mount .toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 10px;
    border-radius: var(--radius);
  }
  #table-mount .list-card {
    box-shadow: var(--shadow-md);
  }

  #btn-all.is-active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* État vide : message d'accompagnement au lieu d'un tableau blanc */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty-state strong { color: var(--ink-soft); font-size: 13.5px; }
  .empty-state span { font-size: 12.5px; }

  /* Badges de type, colorés par catégorie */
  .type-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .type-pill.type-etat        { color: var(--accent-ink); background: var(--accent-soft); }
  .type-pill.type-institution { color: #1e3a8a; background: #dbeafe; }
  .type-pill.type-ministere   { color: var(--accent-ink); background: var(--accent-soft); }
  .type-pill.type-dotation    { color: #7c3a00; background: var(--orange-soft); }
  .type-pill.type-programme   { color: #713f12; background: var(--gold-soft); }

</style>

  function renderTable(filteredRows) {
    SIGIF.mountTable('#table-mount', {
      title: 'Liste des organisations',
      count: filteredRows.length + ' sur ' + allRows.length,
      columns: ['Organisation', 'Code', 'Type', 'Statut'],
      rows: filteredRows.map(function (r) { return r.cells; }),
      page: 1,
      pageCount: 1
    });

    if (filteredRows.length === 0) {
      var tbody = document.querySelector('#table-mount .data-table tbody');
      var colCount = 4;
      if (tbody) {
        var message = hasStarted
          ? { title: 'Aucun résultat', hint: "Essayez un autre terme ou changez de filtre." }
          : { title: 'Aucune organisation affichée', hint: 'Cliquez sur "Tous" ou lancez une recherche pour afficher la liste.' };
        tbody.innerHTML =
          '<tr><td colspan="' + colCount + '">' +
            '<div class="empty-state">' +
              '<strong>' + message.title + '</strong>' +
              '<span>' + message.hint + '</span>' +
            '</div>' +
          '</td></tr>';
      }
    }
  }

  var hasStarted = false;

  function applyFilter(query) {
    query = (query || '').trim().toLowerCase();
    if (btnAll) { btnAll.classList.toggle('is-active', false); }
    var filtered = allRows.filter(function (r) {
      return query === '' ||
        r.label.toLowerCase().indexOf(query) !== -1 ||
        r.code.toLowerCase().indexOf(query) !== -1 ||
        r.type.toLowerCase().indexOf(query) !== -1 ||
        r.id.indexOf(query) !== -1;
    });
    renderTable(filtered);
  }

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      hasStarted = true;
      applyFilter(searchInput.value);
    });
  }
  if (btnAll) {
    btnAll.addEventListener('click', function () {
      if (searchInput) { searchInput.value = ''; }
      hasStarted = true;
      btnAll.classList.add('is-active');
      renderTable(allRows);
    });
  }

  // Table vide par défaut : la liste complète ne s'affiche qu'au clic sur "Tous" ou une recherche
  renderTable([]);
</script>
