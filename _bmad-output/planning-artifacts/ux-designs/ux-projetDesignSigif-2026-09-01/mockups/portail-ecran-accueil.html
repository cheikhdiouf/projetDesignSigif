<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail SIGIF - Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
<style>
  /* Styles propres à l'écran Portail / Accueil */
  html, body {
    background:
      radial-gradient(1100px 420px at 85% -8%, rgba(27, 67, 50, 0.06), transparent 60%),
      var(--bg);
  }

  .main {
    width: 100%;
    max-width: var(--content-max-w);
    margin: 0 auto;
    padding: 36px 36px 64px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-title { font-size: 15px; font-weight: 800; letter-spacing: -0.005em; color: var(--ink); }
  .section-count {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-faint);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 12px;
    flex-shrink: 0;
    margin-left: 16px;
  }

  /* Grille des domaines fonctionnels */
  .domains {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .domain-card { min-height: 160px; }
  .card-icon { width: 48px; height: 48px; }

  @media (max-width: 1080px) {
    .domains { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .main { padding: 22px 18px 40px; }
  }
  @media (max-width: 560px) {
    .domains { grid-template-columns: 1fr; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="app-main">

    <div id="navbar-mount"></div>

    <main class="main">

      <div id="banner-mount"></div>

      <div class="section-head">
        <div class="section-title">Domaines fonctionnels du processus de préparation budgétaire</div>
        <div class="section-count">7 domaines</div>
      </div>

      <div class="domains" id="domains-mount"></div>

    </main>
  </div>
</div>

<script src="shared/app.js"></script>
<script>
  SIGIF.mountNavbar('#navbar-mount', {
    brandSub: 'Préparation budgétaire',
    userName: 'Agent DPB',
    userRole: 'Administrateur DPB',
    userInitials: 'AD'
  });

  SIGIF.mountBanner('#banner-mount', {
    eyebrow: 'Portail SIGIF',
    text: "Processus de préparation du budget de l'État du Sénégal"
  });

  // Les 7 domaines fonctionnels — chaque carte est la porte d'entrée d'un microservice
  SIGIF.mountCards('#domains-mount', [
    {
      icon: 'orgTree', tint: 'leaf',
      title: 'Gestion des référentiels',
      desc: 'Administration des données de référence communes',
      href: 'referentiels-tableau-de-bord.html'
    },
    {
      icon: 'programme', tint: 'gold',
      title: 'Planification des crédits',
      desc: 'Programmation et répartition des enveloppes budgétaires',
      href: '#'
    },
    {
      icon: 'chart', tint: 'orange',
      title: 'Cadrage budgétaire',
      desc: 'Définition des plafonds et orientations budgétaires',
      href: '#'
    },
    {
      icon: 'tag',
      title: 'Marquage',
      desc: 'Identification et suivi des lignes budgétaires',
      href: '#'
    },
    {
      icon: 'objectif', tint: 'leaf',
      title: 'GAR / Cadrage de performance',
      desc: 'Gestion axée sur les résultats et suivi de performance',
      href: '#'
    },
    {
      icon: 'message', tint: 'gold',
      title: 'Dialogue',
      desc: 'Échanges et arbitrages entre acteurs du processus',
      href: '#'
    },
    {
      icon: 'doc',
      title: 'PLF',
      desc: 'Élaboration du Projet de Loi de Finances',
      href: '#'
    }
  ]);
</script>

</body>
</html>
