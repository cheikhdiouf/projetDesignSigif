<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Référentiels - Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
<style>
  /* Styles propres à l'écran Tableau de bord des référentiels */
  .layout {
    width: 100%;
    max-width: var(--content-max-w);
    margin: 0 auto;
    padding: 24px 36px 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .card-icon { width: 44px; height: 44px; }
  .stat-value-row { display: flex; align-items: baseline; gap: 8px; }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
  .stat-label { font-size: 11.5px; color: var(--ink-faint); }
  .donut { flex-shrink: 0; }

  @media (max-width: 1000px) {
    .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .stat-grid { grid-template-columns: 1fr; }
    .topbar, .breadcrumb-bar, .banner-bar, .layout { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>

<div class="app-shell">

  <!-- Sidebar : navigation propre au module Référentiels -->
  <aside class="app-sidebar">
    <nav class="app-nav" id="sidebar-mount"></nav>
  </aside>

  <!-- Colonne principale -->
  <div class="app-main">

    <div id="navbar-mount"></div>

    <div class="banner-bar">
      <div id="banner-mount"></div>
    </div>

    <div class="breadcrumb-bar" id="breadcrumb-mount"></div>

    <div class="layout">
      <div class="stat-grid" id="stats-mount"></div>
    </div>

  </div>

</div>

<script src="shared/app.js"></script>
<script>
  SIGIF.mountSidebar('#sidebar-mount', [
    { icon: 'home', label: 'Tableau de bord', href: 'referentiels-tableau-de-bord.html', active: true },
    { type: 'label', label: 'Référentiels' },
    { icon: 'orgTree', label: 'Organisation', href: '#' },
    { icon: 'programme', label: 'Programme', href: '#' },
    { icon: 'compte', label: 'Compte budgétaire', href: '#' },
    { icon: 'source', label: 'Source de financement', href: '#' },
    { icon: 'objectif', label: 'Objectif', href: '#' },
    { icon: 'complement', label: 'Complément', href: '#' }
  ]);

  SIGIF.mountNavbar('#navbar-mount', {
    brandSub: 'Préparation budgétaire',
    userName: 'Agent DPB',
    userRole: 'Administrateur DPB',
    userInitials: 'AD'
  });

  SIGIF.mountBanner('#banner-mount', {
    eyebrow: 'Portail SIGIF',
    text: "Processus de préparation du budget de l'État du Sénégal"
  });

  SIGIF.mountBreadcrumb('#breadcrumb-mount', [
    { label: 'Portail', href: 'portail-ecran-accueil.html' },
    { label: 'Gestion des référentiels' }
  ]);

  // Vue synthétique des 6 référentiels — chiffres tirés du document de
  // cadrage métier (SVC-REF_Cadrage_Metier_v3.3), pas des valeurs inventées.
  SIGIF.mountCards('#stats-mount', [
    {
      icon: 'orgTree', tint: 'leaf',
      title: 'Organisation',
      stat: { value: '3', label: 'niveaux : Ministère → Programme → Service' },
      href: '#'
    },
    {
      icon: 'programme', tint: 'gold',
      title: 'Programme',
      stat: { value: '4', label: 'sous-types NBE 2020 : Dotation, Support, Métier, CST' },
      href: '#'
    },
    {
      icon: 'compte', tint: 'orange',
      title: 'Compte budgétaire',
      stat: { value: '5', label: 'familles du plan comptable (dépenses, emplois, recettes...)' },
      href: '#'
    },
    {
      icon: 'source',
      title: 'Source de financement',
      stat: { value: '3', label: 'catégories : Propres, Emprunts, Subventions' },
      donut: true,
      href: '#'
    },
    {
      icon: 'objectif', tint: 'leaf',
      title: 'Objectif',
      stat: { value: '→', label: 'référentiel déplacé dans le MS Cadre de performance' },
      href: '#'
    },
    {
      icon: 'complement', tint: 'gold',
      title: 'Complément',
      stat: { value: '5', label: 'types : mode de calcul, collecte, source, PSE...' },
      href: '#'
    }
  ]);
</script>

</body>
</html>
